<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PowerPulse ECU — Garázsnapló</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;font-family:'Space Grotesk',sans-serif;min-height:100vh;color:#fff}
canvas{position:fixed;inset:0;z-index:0}
nav{position:relative;z-index:10;background:rgba(10,10,26,0.95);border-bottom:1px solid rgba(245,158,11,0.2);padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{color:#f59e0b;font-weight:700;font-size:1.1rem;text-decoration:none}
.nav-links{display:flex;gap:16px;align-items:center}
.nav-links a{color:#888;text-decoration:none;font-size:.9rem;transition:.2s}
.nav-links a:hover{color:#f59e0b}
.main{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:40px 20px}
h1{font-size:1.8rem;font-weight:700;margin-bottom:8px}
h1 span{color:#f59e0b}
.subtitle{color:#666;margin-bottom:32px;font-size:.9rem}
.card{background:rgba(12,12,30,0.95);border:1.5px solid rgba(245,158,11,0.2);border-radius:16px;padding:28px;margin-bottom:24px}
.card h3{color:#f59e0b;font-size:1rem;font-weight:700;margin-bottom:20px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}
label{display:block;color:#888;font-size:.82rem;margin-bottom:5px}
input,select,textarea{width:100%;padding:10px 14px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.1);border-radius:8px;color:#fff;font-family:'Space Grotesk',sans-serif;font-size:.9rem}
input:focus,select:focus,textarea:focus{outline:none;border-color:#f59e0b}
select option{background:#0a0a1a}
textarea{resize:vertical;min-height:80px}
.btn{padding:10px 20px;background:#f59e0b;color:#0a0a1a;border:none;border-radius:8px;font-family:'Space Grotesk',sans-serif;font-size:.9rem;font-weight:700;cursor:pointer;transition:.2s}
.btn:hover{background:#fbbf24}
.btn-sm{padding:6px 12px;font-size:.8rem}
.btn-danger{background:rgba(239,68,68,0.1);color:#f87171;border:1px solid rgba(239,68,68,0.3)}
.btn-danger:hover{background:rgba(239,68,68,0.2)}
.msg{padding:10px 14px;border-radius:8px;font-size:.85rem;margin-bottom:12px;display:none}
.msg.error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#f87171;display:block}
.msg.success{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);color:#4ade80;display:block}
.entry{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:18px;margin-bottom:12px}
.entry-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.entry-car{font-weight:700;font-size:1rem;color:#f59e0b}
.entry-type{color:#a5b4fc;font-size:.85rem;margin-top:2px}
.entry-notes{color:#aaa;font-size:.85rem;margin:8px 0}
.entry-meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.hp-badge{display:flex;align-items:center;gap:8px;font-size:.85rem}
.hp-before{color:#888}
.hp-arrow{color:#f59e0b;font-size:1rem}
.hp-after{color:#4ade80;font-weight:600}
.entry-date{color:#555;font-size:.78rem}
.empty{color:#555;font-size:.9rem;text-align:center;padding:32px 0}
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<nav>
  <a href="/" class="nav-logo">⚡ PowerPulse ECU</a>
  <div class="nav-links">
    <a href="/profile.html">Profilom</a>
    <a href="/wheel.html">Kerék</a>
    <a href="/api/user/logout">Kijelentkezés</a>
  </div>
</nav>
<div class="main">
  <h1>🔧 <span>Garázsnapló</span></h1>
  <p class="subtitle">Az összes ECU tuning és szerviz bejegyzésed egy helyen</p>

  <div class="card">
    <h3>➕ Új bejegyzés</h3>
    <div id="add-msg" class="msg"></div>
    <div class="form-row">
      <div><label>Autó neve</label><input type="text" id="g-car" placeholder="pl. Sultan RS"></div>
      <div><label>Tuning típusa</label>
        <select id="g-type">
          <option value="ECU Alap">ECU Alap</option>
          <option value="ECU Sport">ECU Sport</option>
          <option value="ECU Race">ECU Race</option>
          <option value="Profi szerelés">Profi szerelés</option>
          <option value="Diagnosztika">Diagnosztika</option>
          <option value="Egyéb">Egyéb</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div><label>LE előtte</label><input type="number" id="g-before" placeholder="pl. 280"></div>
      <div><label>LE utána</label><input type="number" id="g-after" placeholder="pl. 340"></div>
    </div>
    <div style="margin-bottom:14px"><label>Megjegyzés</label><textarea id="g-notes" placeholder="Pl. sportszűrő + ECU map átírva..."></textarea></div>
    <button class="btn" onclick="addEntry()">Mentés</button>
  </div>

  <div class="card">
    <h3>📋 Bejegyzések</h3>
    <div id="entries-list"><div class="empty">Betöltés...</div></div>
  </div>
</div>
<script>
const canvas=document.getElementById('bg-canvas');const ctx=canvas.getContext('2d');
canvas.width=window.innerWidth;canvas.height=window.innerHeight;
window.addEventListener('resize',()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight});
const pts=Array.from({length:40},()=>({x:Math.random()*canvas.width,y:Math.random()*canvas.height,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()*2+1}));
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>canvas.width)p.vx*=-1;if(p.y<0||p.y>canvas.height)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(245,158,11,0.2)';ctx.fill()});requestAnimationFrame(draw)}
draw();

async function load() {
  const r = await fetch('/api/user/me');
  const me = await r.json();
  if (me.error) { window.location.href='/login.html'; return; }
  const entries = await fetch('/api/garage').then(r=>r.json());
  const el = document.getElementById('entries-list');
  if (!entries.length) { el.innerHTML='<div class="empty">Még nincs bejegyzés — adj hozzá egyet!</div>'; return; }
  el.innerHTML = entries.map(e=>`
    <div class="entry" id="entry-${e.id}">
      <div class="entry-header">
        <div>
          <div class="entry-car">🚗 ${e.car}</div>
          <div class="entry-type">⚡ ${e.tuneType}</div>
        </div>
        <button class="btn btn-sm btn-danger" onclick="deleteEntry('${e.id}')">Törlés</button>
      </div>
      ${e.notes?`<div class="entry-notes">📝 ${e.notes}</div>`:''}
      <div class="entry-meta">
        <div class="hp-badge">
          ${e.hp_before?`<span class="hp-before">${e.hp_before} LE</span><span class="hp-arrow">→</span>`:''}
          ${e.hp_after?`<span class="hp-after">${e.hp_after} LE</span>`:''}
          ${!e.hp_before&&!e.hp_after?'<span style="color:#555">Nincs LE adat</span>':''}
        </div>
        <span class="entry-date">${e.created}</span>
      </div>
    </div>`).join('');
}

async function addEntry() {
  const car=document.getElementById('g-car').value.trim();
  const tuneType=document.getElementById('g-type').value;
  const notes=document.getElementById('g-notes').value.trim();
  const hp_before=document.getElementById('g-before').value;
  const hp_after=document.getElementById('g-after').value;
  const msgEl=document.getElementById('add-msg');
  if(!car){msgEl.textContent='❌ Autó neve kötelező!';msgEl.className='msg error';return;}
  const res=await fetch('/api/garage/add',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:`car=${encodeURIComponent(car)}&tuneType=${encodeURIComponent(tuneType)}&notes=${encodeURIComponent(notes)}&hp_before=${encodeURIComponent(hp_before)}&hp_after=${encodeURIComponent(hp_after)}`});
  const data=await res.json();
  if(data.ok){msgEl.textContent='✅ Bejegyzés mentve!';msgEl.className='msg success';document.getElementById('g-car').value='';document.getElementById('g-notes').value='';document.getElementById('g-before').value='';document.getElementById('g-after').value='';load();}
  else{msgEl.textContent='❌ '+data.error;msgEl.className='msg error';}
}

async function deleteEntry(id) {
  if(!confirm('Biztosan törlöd ezt a bejegyzést?'))return;
  await fetch('/api/garage/'+id,{method:'DELETE'});
  load();
}

load();
</script>
</body>
</html>
